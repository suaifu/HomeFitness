name: Feature Request
description: 提出一个新功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请尽量详细描述你的想法。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / 使用场景
      description: 你遇到了什么问题？或者在什么场景下需要这个功能？
      placeholder: 例如：用户预约成功后，没有提醒功能，容易忘记上课时间
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么解决这个问题或实现这个功能？
      placeholder: 例如：预约成功后发送微信订阅消息提醒
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 这个功能主要涉及哪个模块？
      options:
        - 前端（微信小程序）
        - 后端（Express API）
        - 前后端都需要改动
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他替代方案
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他任何有助于理解需求的信息、截图或参考链接
    validations:
      required: false

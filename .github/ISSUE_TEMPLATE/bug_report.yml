name: Bug Report
description: 报告一个 Bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽量详细地填写以下信息，帮助我们快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清楚地描述发生了什么问题
      placeholder: 例如：在教练详情页点击收藏按钮后，页面崩溃
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      placeholder: |
        1. 打开首页
        2. 点击教练卡片
        3. 点击收藏按钮
        4. 出现错误
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述你期望发生的行为
      placeholder: 例如：收藏成功，按钮变为已收藏状态
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      description: 问题出现在哪个端？
      options:
        - 前端（微信小程序）
        - 后端（Express API）
        - 两者都有
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - 微信开发者工具
        - iOS 真机
        - Android 真机
        - 本地开发（后端）
        - 线上环境（后端）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      description: 粘贴控制台报错、网络请求日志或截图
      placeholder: 可选，但能极大加快定位速度
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他任何有助于解决问题的信息
    validations:
      required: false
